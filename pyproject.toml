# Tooling for the Python examples (patterns/**/python). The examples themselves use only the
# standard library; these dependencies are for linting, type checking and testing.
[project]
name = "design-patterns"
version = "1.0.0"
description = "The 23 GoF design patterns with the same practical example in C#, TypeScript/React, Python and Go."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["patterns"]
python_files = ["test_*.py"]
# Every pattern has its own main.py: importlib mode lets them coexist in one test session.
addopts = ["--import-mode=importlib", "--strict-markers"]

[tool.coverage.run]
source = ["patterns"]
omit = ["*/test_*.py", "conftest.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PL", "C4", "RET", "PT"]
ignore = [
  "PLR2004", # magic values: the examples use literal prices, thresholds and limits on purpose
  "PLR0913", # too many arguments: some participants mirror the GoF signatures
  "RUF001",  # ambiguous unicode characters in strings (e.g. "×" in titles)
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["PLC0415"]
